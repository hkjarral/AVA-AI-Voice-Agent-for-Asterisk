# Weekly compatible batches; major migrations remain individual PRs.
# Security groups are explicit because version-update groups do not cover them.
# PR limits apply only to version updates, not security updates.
version: 2
updates:
  # Model, NumPy and Piper changes stay individual, including security fixes.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    labels: ["dependencies", 'python']
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      core-compatible:
        applies-to: "version-updates"
        patterns: ["*"]
        exclude-patterns: ["numpy", "piper-tts", "torch", "torchaudio", "transformers", "huggingface-hub", "kokoro"]
        update-types: ["minor", "patch"]
      core-security:
        applies-to: "security-updates"
        patterns: ["*"]
        exclude-patterns: ["numpy", "piper-tts", "torch", "torchaudio", "transformers", "huggingface-hub", "kokoro"]
        update-types: ["minor", "patch"]

  # Model, NumPy and Piper changes stay individual, including security fixes.
  - package-ecosystem: "pip"
    directory: "/admin_ui/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    labels: ["dependencies", 'python']
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      admin-backend-compatible:
        applies-to: "version-updates"
        patterns: ["*"]
        exclude-patterns: ["numpy", "piper-tts", "torch", "torchaudio", "transformers", "huggingface-hub", "kokoro"]
        update-types: ["minor", "patch"]
      admin-backend-security:
        applies-to: "security-updates"
        patterns: ["*"]
        exclude-patterns: ["numpy", "piper-tts", "torch", "torchaudio", "transformers", "huggingface-hub", "kokoro"]
        update-types: ["minor", "patch"]

  # Model, NumPy and Piper changes stay individual, including security fixes.
  - package-ecosystem: "pip"
    directory: "/local_ai_server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    labels: ["dependencies", 'python']
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      local-ai-compatible:
        applies-to: "version-updates"
        patterns: ["*"]
        exclude-patterns: ["numpy", "piper-tts", "torch", "torchaudio", "transformers", "huggingface-hub", "kokoro"]
        update-types: ["minor", "patch"]
      local-ai-security:
        applies-to: "security-updates"
        patterns: ["*"]
        exclude-patterns: ["numpy", "piper-tts", "torch", "torchaudio", "transformers", "huggingface-hub", "kokoro"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/admin_ui/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      admin-frontend-compatible:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      admin-frontend-security:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 2
    labels: ["dependencies", 'docker']
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      github-actions-compatible:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-security:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
