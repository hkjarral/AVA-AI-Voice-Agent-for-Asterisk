name: Codex Targeted Review

on:
  workflow_run:
    workflows: [Codex Review Request]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Public AVA pull request number (run from main)"
        required: true
        type: number

permissions: {}

concurrency:
  group: codex-review-${{ github.event.workflow_run.id || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.display_title, 'Codex request #')))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      identity: ${{ steps.pr.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate trusted request and pin public PR
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const {resolvePR} = require('./scripts/codex_review.cjs');
            return await resolvePR(github, context);

  review:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.review.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Review public diff as data, without execution tools
        id: review
        uses: actions/github-script@v9
        env:
          REVIEW_IDENTITY: ${{ needs.resolve.outputs.identity }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_REVIEW_MODEL: ${{ vars.CODEX_REVIEW_MODEL }}
        with:
          result-encoding: string
          script: |
            const {review} = require('./scripts/codex_review.cjs');
            return await review(github, context, JSON.parse(process.env.REVIEW_IDENTITY));

  publish:
    needs: [resolve, review]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish only a completed, current-head review
        uses: actions/github-script@v9
        env:
          REVIEW_IDENTITY: ${{ needs.resolve.outputs.identity }}
          REVIEW_RESULT: ${{ needs.review.outputs.result }}
        with:
          script: |
            const {publish} = require('./scripts/codex_review.cjs');
            await publish(github, context, JSON.parse(process.env.REVIEW_IDENTITY), process.env.REVIEW_RESULT);
